name: Update Proposals

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch proposals
        run: python scripts/fetch-proposals.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _proposals/ _data/
          git diff --staged --quiet || git commit -m "Auto-update proposals $(date -u +%Y-%m-%d_%H:%M)"
          git push
