<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p class="tagline">{{ site.description }}</p>
    <nav>
      <a href="{{ '/' | relative_url }}">Active</a>
      <a href="{{ '/archive' | relative_url }}">Archive</a>
      <a href="{{ '/categories' | relative_url }}">Categories</a>
      <a href="https://github.com/jonahkoch/governance-feed">Edit</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>Last updated: {{ site.time | date: "%Y-%m-%d %H:%M UTC" }}</p>
    <p>Data from <a href="https://koios.rest">Koios</a> • Curated by <a href="https://x.com/kochfoto">@kochfoto</a></p>
  </footer>
</body>
</html>
